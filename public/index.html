<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Adda - Play & Earn</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            min-height: 100vh;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            position: relative;
            padding-bottom: 20px;
        }

        header {
            background: linear-gradient(135deg, #4f46e5, #3730a3);
            color: white;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        header .logo {
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .wallet-badge {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-logout {
            background: rgba(239, 68, 68, 0.2);
            color: #ffffff;
            border: 1px solid rgba(239, 68, 68, 0.5);
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
        }

        .content {
            padding: 20px;
        }

        .nav-tabs {
            display: flex;
            background: #eef2ff;
            padding: 5px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            font-weight: 600;
            color: #4f46e5;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: #ffffff;
            color: #3730a3;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }

        .card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .card h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #1f2937;
        }

        .custom-input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
            margin-bottom: 12px;
        }

        .custom-input:focus {
            border-color: #4f46e5;
        }

        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, #4f46e5, #4338ca);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.2s;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="logo">
                <i class="fa-solid fa-chess-king" style="color: #fbbf24;"></i> Ludo Adda
            </div>
            <div class="header-actions">
                <div class="wallet-badge">
                    <i class="fa-solid fa-wallet" style="color: #fbbf24;"></i> 
                    ₹<span id="walletBalance">0</span>
                </div>
                <button id="logout-btn" class="btn-logout hidden" onclick="logoutUser()"><i class="fa-solid fa-power-off"></i> Logout</button>
            </div>
        </header>

        <div class="content">

            <!-- 1. AUTH / LOGIN SECTION -->
            <div id="loginSection" class="card">
                <h3>Login / Register</h3>
                <p style="font-size: 13px; color: #6b7280; margin-bottom: 15px;">Enter your phone number to continue</p>
                <input type="tel" id="phoneInput" class="custom-input" placeholder="Enter 10-digit Phone Number" maxlength="10">
                <button type="button" onclick="loginUser()" class="btn-primary">Continue</button>
            </div>

            <!-- 2. MAIN DASHBOARD SECTION -->
            <div id="mainDashboard" style="display: none;">

                <!-- Nav Tabs -->
                <div id="main-nav" class="nav-tabs">
                    <button class="tab-btn active" onclick="showSection('lobby')">Battles</button>
                    <button class="tab-btn" onclick="showSection('withdraw')">Withdraw</button>
                    <button class="tab-btn" onclick="showSection('history')">Passbook</button>
                </div>

                <!-- Battles Lobby -->
                <div id="lobby-card">
                    <div class="card">
                        <h3>Create Challenge</h3>
                        <input type="number" id="battle-amount" class="custom-input" placeholder="Amount (Min ₹10)">
                        <button type="button" onclick="createBattle()" class="btn-primary">Create Battle</button>
                    </div>

                    <div class="card">
                        <h3>Open Battles</h3>
                        <div id="battles-list">
                            <p style="color: #9ca3af; font-size: 14px;">Loading battles...</p>
                        </div>
                    </div>
                </div>

                <!-- Room Card -->
                <div id="room-card" class="card hidden">
                    <h3 style="text-align: center; margin-bottom: 15px; color: #1e293b;">Match Started!</h3>
                    <p style="text-align: center; font-size: 16px; font-weight: bold; margin-bottom: 20px;">
                        Battle Amount: ₹<span id="match-amount">0</span>
                    </p>

                    <div id="room-code-box">
                        <input type="text" id="room-code-input" placeholder="Enter Ludo King Room Code" style="width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 8px;">
                        <button onclick="submitRoomCode()" style="width: 100%; background: #4f46e5; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer;">
                            Submit Room Code
                        </button>
                    </div>

                    <div id="result-submission-box" class="hidden" style="margin-top: 20px; border-top: 1px dashed #cbd5e1; padding-top: 20px;">
                        <h4 style="text-align: center; margin-bottom: 15px; color: #334155;">Declare Match Result</h4>
                        <div style="margin-bottom: 15px;">
                            <label style="display: block; margin-bottom: 5px; font-size: 14px; font-weight: 600;">Upload Winning Screenshot:</label>
                            <input type="file" id="screenshot-file" accept="image/*" style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px;">
                        </div>

                        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                            <button onclick="submitResult(event, 'win')" style="flex: 1; background: #10b981; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer;">I Won 🎉</button>
                            <button onclick="submitResult(event, 'lose')" style="flex: 1; background: #ef4444; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer;">I Lost ❌</button>
                        </div>

                        <button onclick="cancelMatch()" style="width: 100%; background: #9ca3af; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer;">Cancel / Leave Match</button>
                    </div>
                </div>

                <!-- Withdraw Card -->
                <div id="withdraw-card" class="card hidden">
                    <h3>Withdraw Earnings</h3>
                    <p style="font-size: 13px; color: #6b7280; margin-bottom: 15px;">Transfer money directly to your UPI ID</p>
                    <input type="text" class="custom-input" placeholder="Enter UPI ID (e.g. user@upi)">
                    <input type="number" class="custom-input" placeholder="Amount">
                    <button type="button" class="btn-primary" style="background: linear-gradient(135deg, #10b981, #059669);">Withdraw Now</button>
                </div>

                <!-- History Card -->
                <div id="history-card" class="card hidden">
                    <h3>Transaction History</h3>
                    <p style="color: #9ca3af; font-size: 14px;">No recent transactions.</p>
                </div>

            </div>

        </div>
    </div>

    <!-- Socket.io & App JS -->
    <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.2/dist/socket.io.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
